name: Publish Grim Grove v0.8.4

on:
  push:
    branches: [main]
    paths:
      - '.deploy/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/grim-grove-publish /tmp/grim-grove-v084.zip /tmp/grim-grove-v084.b64
          cat .deploy/chunks/*.txt > /tmp/grim-grove-v084.b64
          base64 --decode /tmp/grim-grove-v084.b64 > /tmp/grim-grove-v084.zip
          unzip -tq /tmp/grim-grove-v084.zip
          mkdir -p /tmp/grim-grove-publish
          unzip -q /tmp/grim-grove-v084.zip -d /tmp/grim-grove-publish
          test -f /tmp/grim-grove-publish/GrimGroveSurvivors-v0.8.4/index.html

      - name: Replace repository with current game version
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/grim-grove-publish/GrimGroveSurvivors-v0.8.4/. .
          test -f index.html
          test -f css/style.css
          test -f js/main.js
          test -f js/data.js
          test -d assets/sprites
          test -d assets/tiles
          test "$(find assets -type f -name '*.png' | wc -l)" -eq 0
          node --check js/main.js
          node --check js/data.js

      - name: Commit and push v0.8.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Grim Grove Survivors v0.8.4'
          git push origin HEAD:main
